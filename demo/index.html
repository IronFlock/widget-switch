<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Switch</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #f5f5f5;
                font-family:
                    Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
                --font-family-serif: Helvetica;
                color: #291f42;
                font-weight: 400;
                line-height: 1.5;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body>
        <div id="demo"></div>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            import packageJson from '../package.json'
            import '../src/widget-switch.ts'
            import data from '../src/default-data.json'
            import themeObject from './themes/light.json'

            const tag = unsafeStatic(`widget-switch-${packageJson.version}`)
            const theme = { theme_name: 'light', theme_object: themeObject }
            const route = () => '/' + location.search
            render(
                html`
                    <${tag} .theme="${theme}" .inputData=${data} .route=${route()}>
                        web component is not registered. Make sure to use the tag with the correct version
                        string from the package.json
                    </${tag}>
                `,
                document.getElementById('demo')
            )
            const widget = document.getElementById('demo').children[0]

            // Stand in for studio's dashboard-navigator: merge the switch's
            // params into the URL (undefined removes one) and hand the new
            // route back to the widget.
            widget.addEventListener('param-submit', (e) => {
                const params = new URLSearchParams(location.search)
                Object.entries(e.detail.params).forEach(([key, value]) =>
                    value === undefined ? params.delete(key) : params.set(key, value)
                )
                const query = params.toString()
                history.replaceState(null, '', location.pathname + (query ? '?' + query : ''))
                widget.route = route()
            })

            // Re-deliver the data every second, as a dashboard does on each
            // refresh. No device answers here, so a flipped device switch
            // returns to the reported position once its wait runs out.
            setInterval(() => {
                widget.inputData = structuredClone(data)
            }, 1000)
        </script>
    </body>
</html>
